<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ESP32 Smart Car Controller</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px;min-height:100vh;background:radial-gradient(circle at 50% 0%,#2a2a2a 0%,#101010 38%,#000 78%);color:#ffd700;font-family:Arial;text-align:center;user-select:none;touch-action:manipulation}
h1{margin:5px 0 8px;font-size:clamp(26px,6vw,40px);text-shadow:0 0 15px rgba(255,215,0,.75)}
.subtitle{color:#aaa;margin-bottom:14px;font-size:14px}
.status{display:inline-block;padding:7px 15px;margin-bottom:15px;border:1px solid #ffd700;border-radius:20px;background:rgba(255,215,0,.08);color:#ffe98a;font-size:13px}
.camera-box{width:min(95vw,720px);margin:auto;padding:4px;border-radius:22px;background:linear-gradient(135deg,#ffd700,#805d00,#ffd700);box-shadow:0 0 30px rgba(255,215,0,.4)}
.camera-screen{width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#050505;position:relative}
.camera-screen img{width:100%;height:100%;object-fit:cover;display:block}
.camera-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#777;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.7)),repeating-linear-gradient(0deg,#111 0,#111 2px,#151515 2px,#151515 4px)}
.camera-placeholder strong{color:#ffd700;font-size:22px;margin-bottom:7px}
.camera-placeholder span{font-size:12px;color:#999}
.controls{width:min(95vw,570px);margin:18px auto 0}
.row{display:flex;justify-content:center;align-items:center;gap:9px;margin:9px 0}
button{width:125px;min-height:72px;border:0;border-radius:18px;padding:9px;font-size:16px;font-weight:800;color:#090909;background:linear-gradient(145deg,#ffe34d,#eea900);box-shadow:0 5px 18px rgba(255,215,0,.35);cursor:pointer;touch-action:none}
button:active,button.active{transform:scale(.93);filter:brightness(.82)}
.stop{color:#fff;background:linear-gradient(145deg,#ff3b30,#9e0000)}
.horn{width:min(92vw,390px);color:#fff;background:linear-gradient(145deg,#ff9d1c,#ed4d00)}
.light-on{color:#fff;background:linear-gradient(145deg,#20d95b,#008d35)}
.light-off{color:#fff;background:linear-gradient(145deg,#666,#292929)}
.info{margin:18px auto 5px;width:min(95vw,570px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-card{padding:12px;border:1px solid rgba(255,215,0,.25);border-radius:13px;background:rgba(255,215,0,.05)}
.info-card small{display:block;color:#888;margin-bottom:4px}.info-card b{color:#ffd700}
.footer{color:#666;font-size:11px;margin:18px 0 5px}
@media(max-width:520px){body{padding:12px}button{width:29vw;min-width:90px;height:64px;font-size:13px}.horn{width:75vw}}
</style>
</head>
<body>
<h1>🚗 ESP32 SMART CAR</h1>
<div class="subtitle">Wireless Camera & Vehicle Controller</div>
<div class="status" id="status">● DEMO MODE — Controller Ready</div>

<div class="camera-box">
<div class="camera-screen">
<img id="cameraImage" src="camera.jpg" alt="ESP32-CAM">
<div class="camera-placeholder" id="cameraPlaceholder">
<strong>📹 ESP32-CAM</strong>
<span>Put your camera photo here as camera.jpg</span>
</div>
</div>
</div>

<div class="controls">
<div class="row"><button data-command="F">⬆<br>FORWARD</button></div>
<div class="row">
<button data-command="L">⬅<br>LEFT</button>
<button class="stop" data-command="S">⏹<br>STOP</button>
<button data-command="R">RIGHT<br>➡</button>
</div>
<div class="row"><button data-command="B">⬇<br>BACKWARD</button></div>
<div class="row"><button class="horn" id="horn">📢 HORN<br><small>(HOLD)</small></button></div>
<div class="row">
<button class="light-on" data-command="LON">💡<br>LIGHT ON</button>
<button class="light-off" data-command="LOFF">🌙<br>LIGHT OFF</button>
</div>
</div>

<div class="info">
<div class="info-card"><small>Vehicle</small><b id="vehicleStatus">STOPPED</b></div>
<div class="info-card"><small>Headlight</small><b id="lightStatus">OFF</b></div>
<div class="info-card"><small>Horn</small><b id="hornStatus">OFF</b></div>
<div class="info-card"><small>Camera</small><b>ESP32-CAM</b></div>
</div>

<div class="footer">ESP32 Smart Car • ESP32 + L298N + ESP32-CAM</div>

<script>
const REAL_MODE=false;
const CONTROLLER_IP="YOUR_ESP32_CONTROLLER_IP";

function sendCommand(command){
  if(REAL_MODE){
    fetch("http://"+CONTROLLER_IP+"/"+command).catch(()=>{});
  }
  updateUI(command);
}

function updateUI(command){
  if(command==="F")vehicleStatus.textContent="FORWARD";
  if(command==="B")vehicleStatus.textContent="BACKWARD";
  if(command==="L")vehicleStatus.textContent="LEFT";
  if(command==="R")vehicleStatus.textContent="RIGHT";
  if(command==="S")vehicleStatus.textContent="STOPPED";
  if(command==="LON")lightStatus.textContent="ON";
  if(command==="LOFF")lightStatus.textContent="OFF";
  if(command==="HON")hornStatus.textContent="ON";
  if(command==="HOFF")hornStatus.textContent="OFF";
  status.textContent="● DEMO MODE — "+vehicleStatus.textContent;
}

document.querySelectorAll("[data-command]").forEach(button=>{
  const command=button.dataset.command;
  if(command==="S"||command==="LON"||command==="LOFF"){
    button.addEventListener("click",()=>sendCommand(command));
    return;
  }
  function start(e){e.preventDefault();button.classList.add("active");sendCommand(command)}
  function stop(e){if(e)e.preventDefault();button.classList.remove("active");sendCommand("S")}
  button.addEventListener("pointerdown",start);
  button.addEventListener("pointerup",stop);
  button.addEventListener("pointercancel",stop);
  button.addEventListener("pointerleave",e=>{if(button.classList.contains("active"))stop(e)});
});

const horn=document.getElementById("horn");
function hornStart(e){e.preventDefault();horn.classList.add("active");sendCommand("HON")}
function hornStop(e){if(e)e.preventDefault();horn.classList.remove("active");sendCommand("HOFF")}
horn.addEventListener("pointerdown",hornStart);
horn.addEventListener("pointerup",hornStop);
horn.addEventListener("pointercancel",hornStop);

window.addEventListener("blur",()=>{sendCommand("S");sendCommand("HOFF")});

const cameraImage=document.getElementById("cameraImage");
const cameraPlaceholder=document.getElementById("cameraPlaceholder");
cameraImage.addEventListener("load",()=>cameraPlaceholder.style.display="none");
cameraImage.addEventListener("error",()=>{cameraImage.style.display="none";cameraPlaceholder.style.display="flex"});
</script>
</body>
</html>
